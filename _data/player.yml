# Player server configuration
# default_server sets which server the site should treat as the default embed provider.
# Add more servers here; keys are used as server identifiers in templates or scripts.

default_server: vidplus

servers:
  vidplus:
    name: "VidPlus (default)"
    base_url: "https://player.vidplus.to/embed"
    note: "Official default embed player used by the site"

  minecloud:
    name: "MineCloud"
    base_url: "https://player.minecloud.to/embed"
    note: "Alternate anime streaming server (example). Replace base_url with your provider's embed endpoint."
