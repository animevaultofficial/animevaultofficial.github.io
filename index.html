<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#030f16" />

    <title>AnimeVault — Watch Anime Online</title>
    <meta name="description" content="AnimeVault — discover and watch your favorite anime, movies, and TV shows online." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://animevaultofficial.fun/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnimeVault" />
    <meta property="og:title" content="AnimeVault — Watch Anime Online" />
    <meta property="og:description" content="Discover and watch your favorite anime, movies, and TV shows on AnimeVault." />
    <meta property="og:image" content="https://animevaultofficial.fun/logo.png" />
    <meta property="og:url" content="https://animevaultofficial.fun/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AnimeVault — Watch Anime Online" />
    <meta name="twitter:description" content="Discover and watch your favorite anime, movies, and TV shows on AnimeVault." />
    <meta name="twitter:image" content="https://animevaultofficial.fun/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="icon" href="/logo.png" type="image/png" />
    <style>
      /* AnimeVault header redesign — layout/content stays untouched. */
      .topbar {
        position: sticky !important;
        top: 0 !important;
        z-index: 900 !important;
        min-height: 68px !important;
        padding: .55rem clamp(1rem, 3vw, 2.25rem) !important;
        background: linear-gradient(180deg, rgba(5,7,11,.94), rgba(5,7,11,.72)) !important;
        border-bottom: 1px solid rgba(255,255,255,.07) !important;
        box-shadow: 0 10px 35px rgba(0,0,0,.18) !important;
        backdrop-filter: blur(22px) saturate(140%) !important;
        -webkit-backdrop-filter: blur(22px) saturate(140%) !important;
      }
      .topbar-brand-wrap { gap: .8rem !important; }
      .topbar .brand {
        gap: .7rem !important;
        padding: .35rem .55rem !important;
        border-radius: 12px !important;
        transition: background .2s ease, transform .2s ease !important;
      }
      .topbar .brand:hover { background: rgba(255,255,255,.055) !important; transform: translateY(-1px); }
      .topbar .brand img { height: 36px !important; filter: drop-shadow(0 0 12px rgba(255,26,117,.2)); }
      .topbar .brand span {
        font-family: Sora, Geist, sans-serif !important;
        font-size: 1rem !important;
        font-weight: 800 !important;
        letter-spacing: -.03em !important;
      }
      .topnav { gap: .25rem !important; margin-left: .8rem !important; }
      .topnav .nav-link {
        position: relative !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: .45rem !important;
        padding: .62rem .78rem !important;
        border-radius: 10px !important;
        color: rgba(255,255,255,.62) !important;
        font-size: .78rem !important;
        font-weight: 700 !important;
        transition: color .2s ease, background .2s ease, transform .2s ease !important;
      }
      .topnav .nav-link:hover { color: #fff !important; background: rgba(255,255,255,.055) !important; transform: translateY(-1px); }
      .topnav .nav-link.active {
        color: #fff !important;
        background: linear-gradient(135deg, rgba(255,26,117,.16), rgba(255,26,117,.05)) !important;
      }
      .topnav .nav-link.active::after {
        content: '' !important;
        position: absolute !important;
        left: 50% !important;
        bottom: 3px !important;
        width: 16px !important;
        height: 2px !important;
        border-radius: 999px !important;
        background: #ff1a75 !important;
        transform: translateX(-50%) !important;
        box-shadow: 0 0 12px rgba(255,26,117,.8) !important;
      }
      .topbar-actions { gap: .55rem !important; }
      .topbar-search-form {
        min-width: 210px !important;
        height: 40px !important;
        padding: 0 .75rem !important;
        border: 1px solid rgba(255,255,255,.09) !important;
        border-radius: 12px !important;
        background: rgba(255,255,255,.055) !important;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.03) !important;
        transition: border-color .2s ease, background .2s ease, box-shadow .2s ease !important;
      }
      .topbar-search-form:hover,
      .topbar-search-form:focus-visible {
        border-color: rgba(255,26,117,.42) !important;
        background: rgba(255,255,255,.075) !important;
        box-shadow: 0 0 0 3px rgba(255,26,117,.08) !important;
      }
      .topbar-search-form span { color: rgba(255,255,255,.46) !important; font-size: .76rem !important; }
      .topbar-search-form svg { color: rgba(255,255,255,.7) !important; }
      .topbar-search-form kbd {
        margin-left: auto !important;
        padding: .16rem .38rem !important;
        border: 1px solid rgba(255,255,255,.1) !important;
        border-radius: 5px !important;
        background: rgba(0,0,0,.2) !important;
        color: rgba(255,255,255,.42) !important;
        font-size: .62rem !important;
      }
      .header-profile,
      .topbar-actions > button:not(.topbar-search-form) {
        height: 40px !important;
        padding: 0 .78rem !important;
        border: 1px solid rgba(255,255,255,.09) !important;
        border-radius: 11px !important;
        background: rgba(255,255,255,.045) !important;
        color: rgba(255,255,255,.82) !important;
        transition: .2s ease !important;
      }
      .header-profile:hover,
      .topbar-actions > button:not(.topbar-search-form):hover { background: rgba(255,255,255,.08) !important; border-color: rgba(255,26,117,.3) !important; }
      .header-profile span { font-size: .75rem !important; font-weight: 700 !important; }
      .hamburger-btn { border-radius: 11px !important; }
      @media (max-width: 1180px) {
        .topbar { min-height: 62px !important; padding: .5rem .85rem !important; }
        .topbar .brand img { height: 31px !important; }
        .topbar .brand span { font-size: .9rem !important; }
        .topbar-search-form { min-width: 42px !important; width: 42px !important; justify-content: center !important; padding: 0 !important; }
      }
      @media (max-width: 560px) {
        .topbar { min-height: 58px !important; }
        .topbar .brand { padding: .25rem .4rem !important; }
        .topbar .brand span { display: none !important; }
        .topbar .brand img { height: 30px !important; }
      }
    </style>
  </head>
  <body class="app-body">
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect restore -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
