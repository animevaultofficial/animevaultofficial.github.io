name: Temporarily disable anime section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  disable-anime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable anime navigation and routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace("const AnimeDetails = lazy(() => import('./pages/AnimeDetails'));\n", "")
          s = s.replace("const Home = lazy(() => import('./pages/Home'));\n", "")
          s = s.replace("  ['/', 'Home', HomeIcon], ['/anime', 'Anime', TvIcon], ['/manga', 'Manga', BookOpen],", "  ['/', 'Home', HomeIcon], ['/manga', 'Manga', BookOpen],")
          s = s.replace("<Route path=\"/\" element={<MixedHome />} /><Route path=\"/search\" element={<Search />} /><Route path=\"/anime\" element={<Home />} /><Route path=\"/anime/:id\" element={<AnimeDetails />} />", "<Route path=\"/\" element={<MixedHome />} /><Route path=\"/search\" element={<Search />} /><Route path=\"/anime\" element={<AnimeUnavailable />} /><Route path=\"/anime/:id\" element={<AnimeUnavailable />} />")
          s = s.replace("const MangaHome = lazy(() => import('./pages/MangaHome'));", "const AnimeUnavailable = lazy(() => import('./pages/AnimeUnavailable'));\nconst MangaHome = lazy(() => import('./pages/MangaHome'));")
          s = s.replace("<NavLink to=\"/anime\" className={({ isActive }) => isActive ? 'bottom-nav-link active' : 'bottom-nav-link'}><TvIcon size={20} /><span>Anime</span></NavLink>", "")
          p.write_text(s)
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/disable-anime-temporarily.yml
          git rm .github/workflows/disable-anime-temporarily.yml
          git diff --cached --quiet && exit 0
          git commit -m "Temporarily disable anime section"
          git push
