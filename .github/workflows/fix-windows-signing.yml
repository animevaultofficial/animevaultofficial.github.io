name: Fix Windows signing workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch desktop signing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/electron-build.yml')
          text = path.read_text()
          old = '''      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
          WIN_CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          WIN_CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
        run: npm run electron:build -- ${{ matrix.args }}'''
          new = '''      - name: Prepare Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:GITHUB_WORKSPACE 'animevault-code-signing.pfx'
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64.Trim()))
            Write-Host 'Using the configured Windows code-signing PFX secret.'
          } else {
            if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
              throw 'CSC_KEY_PASSWORD is required when WINDOWS_CODE_SIGNING_PFX_BASE64 is not configured.'
            }
            Write-Host 'WINDOWS_CODE_SIGNING_PFX_BASE64 is not configured; generating a temporary self-signed certificate for this CI build.'
            $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Subject 'CN=AnimeVault' -KeyExportPolicy Exportable -KeyLength 2048 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyUsage DigitalSignature -Type CodeSigningCert
            Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfx -Password $secure -ChainOption BuildChain | Out-Null
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $pfx)) { throw 'Code-signing PFX was not created.' }
          "WINDOWS_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && '${{ github.workspace }}/animevault-code-signing.pfx' || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && '${{ github.workspace }}/animevault-code-signing.pfx' || secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
        run: npm run electron:build -- ${{ matrix.args }}'''
          if old not in text:
              raise SystemExit('Expected signing block was not found; refusing to modify workflow.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/electron-build.yml
          git rm .github/workflows/fix-windows-signing.yml
          git commit -m 'fix: repair desktop code-signing certificate setup'
          git push origin main
