name: Android UI validation

on:
  push:
    branches: [main]
    paths:
      - 'src/mobile/**'
      - 'src/styles.css'
      - '.github/workflows/sync-android-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnimeVault
        uses: actions/checkout@v4

      - name: Validate mobile UI assets
        shell: bash
        run: |
          set -euo pipefail
          test -f src/mobile/mobile-android-design.css
          test -f src/mobile/AppMobile.jsx
          echo "AnimeVault Android/mobile UI assets are present."
