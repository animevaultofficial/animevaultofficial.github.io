name: Deploy to GitHub Pages

# Builds the Vite app and publishes the generated dist directory to gh-pages.
# The custom-domain CNAME is explicitly copied into dist so every deployment
# keeps animevaultofficial.fun connected to GitHub Pages.
#
# IMPORTANT: Vite uses content-hashed JS/CSS filenames. Keep previously
# published assets so an already-open browser tab can still load an older
# chunk while it receives the new index.html.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
  VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
  VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY }}
  VITE_AUTH_PROXY_URL: https://animevaultofficial-github-io.onrender.com
  VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
  VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_API_URL VITE_NEON_AUTH_URL VITE_DATABASE_URL VITE_HCAPTCHA_SITEKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing AnimeVault production secret::$name is empty or unavailable to this job"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production configuration is incomplete. Check repository/environment secrets."
            exit 1
          fi

      - name: Build production bundle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npx vite build --mode production

      - name: Preserve GitHub Pages custom domain
        run: |
          printf '%s\n' 'animevaultofficial.fun' > dist/CNAME
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: GitHub Pages bundle from ${{ github.sha }}"
