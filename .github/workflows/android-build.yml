name: AnimeVault Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor
        run: |
          npx cap --version
          node -e "const p=require('./package.json'); if(p.dependencies['@capacitor/app'] !== '6.0.3') throw new Error('Expected @capacitor/app 6.0.3')"

      - name: Build web
        run: npm run build

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npm run generate-android-icons
          npx vite build --config vite.mobile.config.js
          npx cap sync android

      - name: Add OAuth deep link
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          scheme = 'android:scheme="animevault"'

          if scheme not in text:
              # Find Capacitor's MainActivity, regardless of whether the generated
              # manifest uses a relative or fully-qualified activity name.
              match = re.search(r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>', text)
              if not match:
                  match = re.search(r'<activity\b[^>]*>', text)
              if not match:
                  raise SystemExit('No Android activity found in generated manifest')

              activity_open = match.group(0)
              if activity_open.rstrip().endswith('/>'):
                  raise SystemExit('Generated MainActivity is self-closing; cannot add OAuth intent-filter')

              activity_end = text.find('</activity>', match.end())
              if activity_end < 0:
                  raise SystemExit('MainActivity closing tag not found')

              intent = '''
        <intent-filter>
            <action android:name="android.intent.action.VIEW" />
            <category android:name="android.intent.category.DEFAULT" />
            <category android:name="android.intent.category.BROWSABLE" />
            <data android:scheme="animevault" android:host="oauth" />
        </intent-filter>'''

              text = text[:activity_end] + intent + text[activity_end:]
              path.write_text(text)

          if scheme not in path.read_text():
              raise SystemExit('OAuth deep link was not added')
          print('OAuth deep link configured successfully')
          PY

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          mkdir -p android
          printf '%s' "$KEYSTORE" | base64 --decode > android/animevault-release.keystore
          chmod 600 android/animevault-release.keystore

      - name: Configure signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          version=json.loads(Path('package.json').read_text())['version']
          a,b,c=map(int,version.split('.'))
          code=a*1000000+b*1000+c
          p=Path('android/app/build.gradle')
          s=p.read_text()
          signing='''    signingConfigs {
          release {
              storeFile file("../animevault-release.keystore")
              storePassword System.getenv("STORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }
      }

      '''
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig signingConfigs.release' not in s:
              s=s.replace('    buildTypes {\n        release {','    buildTypes {\n        release {\n            signingConfig signingConfigs.release',1)
          s=re.sub(r'(versionCode\s+)\d+',rf'\g<1>{code}',s,count=1)
          s=re.sub(r'(versionName\s+)"[^"]+"',rf'\g<1>"{version}"',s,count=1)
          p.write_text(s)
          print(version, code)
          PY

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Build AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon bundleRelease

      - name: Prepare artifacts
        run: |
          set -e
          mkdir -p release/android
          cp android/app/build/outputs/apk/release/*.apk release/android/AnimeVault-Android.apk
          cp android/app/build/outputs/bundle/release/*.aab release/android/AnimeVault-Android.aab
          test -s release/android/AnimeVault-Android.apk
          test -s release/android/AnimeVault-Android.aab
          apksigner verify --verbose release/android/AnimeVault-Android.apk

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-Android
          path: release/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: AnimeVault Android Build ${{ github.run_number }}
          body: Automated signed APK and AAB build from main.
          files: |
            release/android/AnimeVault-Android.apk
            release/android/AnimeVault-Android.aab
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f android/animevault-release.keystore
