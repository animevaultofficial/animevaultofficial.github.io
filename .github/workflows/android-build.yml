name: AnimeVault Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor
        run: |
          npx cap --version
          node -e "const p=require('./package.json'); if(p.dependencies['@capacitor/app'] !== '6.0.3') throw new Error('Expected @capacitor/app 6.0.3')"

      - name: Build web
        run: npm run build

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npm run generate-android-icons
          npx vite build --config vite.mobile.config.js
          npx cap sync android

      - name: Configure OAuth deep link
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          android = '{http://schemas.android.com/apk/res/android}'
          root = ET.fromstring(text)

          application = root.find('application')
          if application is None:
              raise SystemExit('AndroidManifest: <application> not found')

          activities = application.findall('activity')
          if not activities:
              raise SystemExit('AndroidManifest: no <activity> found')

          activity = next(
              (a for a in activities if a.get(android + 'name', '').endswith('MainActivity')),
              activities[0],
          )

          existing = any(
              data.get(android + 'scheme') == 'animevault' and
              data.get(android + 'host') == 'oauth'
              for intent in activity.findall('intent-filter')
              for data in intent.findall('data')
          )

          if not existing:
              intent = ET.Element('intent-filter')
              ET.SubElement(intent, 'action', {android + 'name': 'android.intent.action.VIEW'})
              ET.SubElement(intent, 'category', {android + 'name': 'android.intent.category.DEFAULT'})
              ET.SubElement(intent, 'category', {android + 'name': 'android.intent.category.BROWSABLE'})
              ET.SubElement(intent, 'data', {
                  android + 'scheme': 'animevault',
                  android + 'host': 'oauth',
              })
              activity.append(intent)

              # Preserve the Android namespace expected by aapt/Gradle.
              ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
              ET.ElementTree(root).write(path, encoding='utf-8', xml_declaration=True)

          check = path.read_text(encoding='utf-8')
          if 'android:scheme="animevault"' not in check or 'android:host="oauth"' not in check:
              raise SystemExit('OAuth deep link verification failed')
          print('OAuth deep link configured successfully')
          PY

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > android/animevault-release.keystore
          chmod 600 android/animevault-release.keystore

      - name: Configure signing and version
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          a, b, c = map(int, version.split('.'))
          code = a * 1000000 + b * 1000 + c
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              signing = '''    signingConfigs {
          release {
              storeFile file("../animevault-release.keystore")
              storePassword System.getenv("STORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }
      }

      '''
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('    buildTypes {\n        release {', '    buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
          s = re.sub(r'(versionCode\s+)\d+', rf'\g<1>{code}', s, count=1)
          s = re.sub(r'(versionName\s+)"[^"]+"', rf'\g<1>"{version}"', s, count=1)
          p.write_text(s)
          print(f'Android versionName={version}, versionCode={code}')
          PY

      - name: Build signed APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build signed AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Prepare and verify artifacts
        run: |
          set -euo pipefail
          mkdir -p release/android
          cp android/app/build/outputs/apk/release/*.apk release/android/AnimeVault-Android.apk
          cp android/app/build/outputs/bundle/release/*.aab release/android/AnimeVault-Android.aab
          test -s release/android/AnimeVault-Android.apk
          test -s release/android/AnimeVault-Android.aab
          apksigner verify --verbose release/android/AnimeVault-Android.apk

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-Android
          path: release/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: AnimeVault Android Build ${{ github.run_number }}
          body: Automated signed APK and AAB build from main.
          files: |
            release/android/AnimeVault-Android.apk
            release/android/AnimeVault-Android.aab
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f android/animevault-release.keystore
