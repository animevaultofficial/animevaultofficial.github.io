name: AnimeVault content fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch player and disable anime surfaces
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Movie player: VidSrc movie endpoints are more reliable with IMDb IDs;
          # Videasy and VidNest continue using TMDB IDs. TV remains unchanged.
          p = Path('src/pages/MovieWatch.jsx')
          s = p.read_text()
          old = "const sourceUrl = getSourceUrl(server, 'movie' === type ? 'movie' : 'tv', meta.tmdbId || id, season, episode, {}, storage.get('accentColor') || 'ff1a75');"
          new = "const providerId = type === 'movie' && server === 'vidsrc' ? (meta.imdb_id || meta.tmdbId || id) : (meta.tmdbId || id);\n        const sourceUrl = getSourceUrl(server, 'movie' === type ? 'movie' : 'tv', providerId, season, episode, {}, storage.get('accentColor') || 'ff1a75');"
          if old not in s:
              raise SystemExit('MovieWatch source generation line not found')
          s = s.replace(old, new)
          s = s.replace("const movieServers = PLAYER_SOURCES.filter(s => ['vidsrc','vidking','vidnest'].includes(s.id));", "const movieServers = PLAYER_SOURCES.filter(s => ['vidsrc','videasy','vidnest'].includes(s.id));")
          p.write_text(s)

          # Disable AniList anime fetches globally while leaving manga functionality intact.
          p = Path('src/api/anilist.js')
          s = p.read_text()
          replacements = [
            ('export async function fetchTrendingMedia(\n  type = "ANIME",', 'export async function fetchTrendingMedia(\n  type = "ANIME",\n')
          ]
          marker = 'const CACHE_TTL = 1000 * 60 * 30; // 30 minutes cache\n'
          if 'const ANIME_STREAMS_DISABLED = true;' not in s:
              s = s.replace(marker, marker + '\nconst ANIME_STREAMS_DISABLED = true;\n')
          # Insert guards immediately after function openings using stable signatures.
          patterns = [
              (r'(export async function fetchTrendingMedia\(\s*type = "ANIME",\s*page = 1,\s*perPage = 18,?\s*\)\s*\{)', r'\1\n  if (ANIME_STREAMS_DISABLED && type === "ANIME") return [];'),
              (r'(export async function searchAnime\(\s*search,\s*type = "ANIME",)', r'\1'),
          ]
          s2, n = re.subn(patterns[0][0], patterns[0][1], s)
          if n == 0:
              print('fetchTrendingMedia guard pattern did not match; continuing')
          s = s2
          # searchAnime has a multiline signature; place guard before its first statement.
          sig = 'export async function searchAnime(\n  search,\n  type = "ANIME",'
          if sig in s and 'if (ANIME_STREAMS_DISABLED && type === "ANIME") return [];\n' not in s[s.index(sig):s.index(sig)+500]:
              start = s.index(sig)
              brace = s.index('{', start)
              s = s[:brace+1] + '\n  if (ANIME_STREAMS_DISABLED && type === "ANIME") return [];' + s[brace+1:]
          p.write_text(s)

          # Replace the homepage with movie/TV-only content. This removes cached/static anime
          # fallbacks as well as live anime sections.
          Path('src/pages/MixedHome.jsx').write_text(r'''import { useEffect, useState } from 'react';
import { Link } from 'react-router-dom';
import { Play, ChevronRight, Film, Tv } from 'lucide-react';
import { fetchLatestMovies, fetchLatestTVShows } from '../api/movies';

export default function MixedHome() {
  const [movies, setMovies] = useState([]);
  const [tvShows, setTvShows] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    Promise.all([fetchLatestMovies(1).catch(() => []), fetchLatestTVShows(1).catch(() => [])])
      .then(([m, t]) => {
        if (!cancelled) { setMovies(m || []); setTvShows(t || []); }
      })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, []);

  const Card = ({ item, kind }) => (
    <Link
      to={`/watch/${kind === 'movie' ? 'movie' : 'tv'}/${item.tmdbId || item.id}`}
      className="anime-card-v2"
      style={{ textDecoration: 'none' }}
    >
      <div className="card-media">
        <img src={item.poster} alt={item.title} loading="lazy" decoding="async" />
        <div className="card-overlay"><div className="play-icon-wrapper"><Play fill="white" size={24} /></div></div>
      </div>
      <div className="card-info">
        <h3 className="card-title">{item.title || item.name}</h3>
        <div className="card-meta"><span>{kind === 'movie' ? 'MOVIE' : 'TV SHOW'}</span>{item.year && <><span className="dot">•</span><span>{item.year}</span></>}</div>
      </div>
    </Link>
  );

  return (
    <section className="home-v2">
      <div className="home-main-v2">
        <div className="section-v2" style={{ paddingTop: 36 }}>
          <div className="section-header-v2">
            <div><h1>AnimeVault</h1><p>Movies and TV shows</p></div>
            <Link to="/dramas-movies" className="view-all">Browse all <ChevronRight size={18} /></Link>
          </div>
        </div>

        {loading ? <div className="section-loading">Loading movies and TV shows…</div> : <>
          <div className="section-v2">
            <div className="section-header-v2"><div><h2><Film size={19} /> Movies</h2><p>Popular movies available to watch.</p></div></div>
            <div className="trending-grid-v2">{movies.slice(0, 12).map(item => <Card key={item.id} item={item} kind="movie" />)}</div>
          </div>
          <div className="section-v2">
            <div className="section-header-v2"><div><h2><Tv size={19} /> TV Shows</h2><p>Popular series and dramas.</p></div></div>
            <div className="trending-grid-v2">{tvShows.slice(0, 12).map(item => <Card key={item.id} item={item} kind="tv" />)}</div>
          </div>
        </>}
      </div>
    </section>
  );
}
''')

          # Replace the search page with a movie/TV-only search surface.
          Path('src/pages/Search.jsx').write_text(r'''import { useEffect, useState } from 'react';
import { useSearchParams, Link } from 'react-router-dom';
import { Search as SearchIcon, Film, Tv } from 'lucide-react';
import { searchMoviesAndSeries, fetchLatestMovies, fetchLatestTVShows } from '../api/movies';

export default function Search() {
  const [params, setParams] = useSearchParams();
  const [query, setQuery] = useState(params.get('q') || '');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);

  async function runSearch(value = query) {
    const q = value.trim();
    setLoading(true);
    try {
      if (q) {
        setResults(await searchMoviesAndSeries(q));
      } else {
        const [movies, tv] = await Promise.all([fetchLatestMovies(1), fetchLatestTVShows(1)]);
        setResults([...(movies || []), ...(tv || [])]);
      }
    } finally { setLoading(false); }
  }

  useEffect(() => { runSearch(params.get('q') || ''); }, [params]);

  const submit = (e) => {
    e.preventDefault();
    const q = query.trim();
    setParams(q ? { q, type: 'MOVIES/SERIES' } : { type: 'MOVIES/SERIES' });
  };

  return <div className="premium-search-page">
    <div className="premium-layout">
      <main style={{ width: '100%' }}>
        <form onSubmit={submit} style={{ display: 'flex', gap: 10, marginBottom: 24 }}>
          <SearchIcon size={20} />
          <input className="search-input" value={query} onChange={e => setQuery(e.target.value)} placeholder="Search movies and series..." />
        </form>
        <div className="section-header-v2"><div><h2>{query ? `Results for “${query}”` : 'Movies & TV Shows'}</h2><p>Anime is temporarily unavailable and hidden from search.</p></div></div>
        {loading ? <div className="section-loading">Searching…</div> : <div className="trending-grid-v2">
          {results.map(item => {
            const kind = item.mediaType === 'series' || item.type === 'series' ? 'tv' : 'movie';
            return <Link key={`${kind}-${item.id}`} to={`/watch/${kind}/${item.tmdbId || item.id}`} className="anime-card-v2" style={{ textDecoration: 'none' }}>
              <div className="card-media"><img src={item.poster} alt={item.title || item.name} loading="lazy" /><div className="card-overlay"><div className="play-icon-wrapper"><PlayIcon /></div></div></div>
              <div className="card-info"><h3 className="card-title">{item.title || item.name}</h3><div className="card-meta"><span>{kind === 'movie' ? <><Film size={12} /> MOVIE</> : <><Tv size={12} /> TV SHOW</>}</span>{item.year && <><span className="dot">•</span><span>{item.year}</span></>}</div></div>
            </Link>;
          })}
        </div>}
      </main>
    </div>
  </div>;
}

function PlayIcon() { return <span style={{ display: 'inline-flex' }}>▶</span>; }
''')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/MovieWatch.jsx src/pages/MixedHome.jsx src/pages/Search.jsx src/api/anilist.js
          git commit -m "Fix movie provider IDs and disable anime surfaces" || exit 0
          git push
