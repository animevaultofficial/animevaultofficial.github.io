name: Apply final signing repair

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch desktop signing
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/electron-build.yml')
          s = p.read_text()
          old = '''      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
          WIN_CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          WIN_CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
        run: npm run electron:build -- ${{ matrix.args }}
'''
          new = '''      - name: Prepare Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:GITHUB_WORKSPACE 'animevault-code-signing.pfx'
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64.Trim()))
          } else {
            if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { throw 'CSC_KEY_PASSWORD is required.' }
            $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = New-SelfSignedCertificate -Subject 'CN=AnimeVault' -KeyExportPolicy Exportable -KeyLength 2048 -CertStoreLocation 'Cert:\CurrentUser\My' -KeyUsage DigitalSignature -Type CodeSigningCert
            Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath $pfx -Password $secure -ChainOption BuildChain | Out-Null
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $pfx)) { throw 'Code-signing PFX was not created.' }
      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && format('{0}/animevault-code-signing.pfx', github.workspace) || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && format('{0}/animevault-code-signing.pfx', github.workspace) || secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
        run: npm run electron:build -- ${{ matrix.args }}
'''
          if old not in s:
              raise SystemExit('Expected original signing block was not found.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-windows-signing.yml .github/workflows/apply-signing-fix.yml .github/workflows/repair-signing-now.yml .github/workflows/apply-final-signing.yml
          git add .github/workflows/electron-build.yml
          git add -u .github/workflows
          git commit -m 'fix: repair desktop code-signing certificate setup'
          git push origin main
