name: Build Mobile APK

on:
  push:
    branches:
      - mobile-frontend-rebuild
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install mobile app dependencies
        working-directory: mobile-app
        run: npm install

      - name: Generate native Android project with Expo prebuild
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install

      - name: Grant execute permission to Gradle wrapper
        working-directory: mobile-app
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animevault-mobile-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Generate release tag
        id: tag
        run: echo "tag=$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mobile-${{ steps.tag.outputs.tag }}
          name: AnimeVault Mobile Debug APK - ${{ steps.tag.outputs.tag }}
          body: |
            ## AnimeVault Mobile Debug APK Build
            
            **Build Date:** ${{ steps.tag.outputs.tag }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            ### Download
            - `app-debug.apk` - Debug Android APK (installable on Android devices)
            
            ### Installation
            1. Download the APK file
            2. Transfer to your Android device or use ADB:
               ```bash
               adb install app-debug.apk
               ```
            3. The app will appear in your app drawer as "AnimeVault"
            
            ### Notes
            - This is a **DEBUG build**, not for production use
            - Signing is not production-grade
            - Built from branch: `${{ github.ref_name }}`
          files: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
