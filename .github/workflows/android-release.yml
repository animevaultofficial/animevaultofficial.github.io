name: AnimeVault Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build signed Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build mobile web app
        run: |
          npm run build
          rm -rf android
          npx cap add android
          npm run generate-android-icons
          npx vite build --config vite.mobile.config.js
          npx cap sync android

      - name: Configure OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('android/app/src/main/AndroidManifest.xml')
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          root = ET.fromstring(p.read_text())
          app = root.find('application')
          activities = [] if app is None else app.findall('activity')
          if not activities:
              raise SystemExit('No Android activity found')
          activity = next((a for a in activities if a.get('{%s}name' % ns, '').endswith('MainActivity')), activities[0])
          found = any(d.get('{%s}scheme' % ns) == 'animevault' and d.get('{%s}host' % ns) == 'oauth' for f in activity.findall('intent-filter') for d in f.findall('data'))
          if not found:
              f = ET.SubElement(activity, 'intent-filter')
              ET.SubElement(f, 'action', {'{%s}name' % ns: 'android.intent.action.VIEW'})
              ET.SubElement(f, 'category', {'{%s}name' % ns: 'android.intent.category.DEFAULT'})
              ET.SubElement(f, 'category', {'{%s}name' % ns: 'android.intent.category.BROWSABLE'})
              ET.SubElement(f, 'data', {'{%s}scheme' % ns: 'animevault', '{%s}host' % ns: 'oauth'})
          ET.ElementTree(root).write(p, encoding='utf-8', xml_declaration=True)
          text = p.read_text()
          assert 'android:scheme="animevault"' in text and 'android:host="oauth"' in text
          PY

      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > android/animevault-release.keystore
          chmod 600 android/animevault-release.keystore
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          v = json.loads(Path('package.json').read_text())['version']
          a,b,c = map(int, v.split('.'))
          code = a*1000000+b*1000+c
          p=Path('android/app/build.gradle')
          s=p.read_text()
          signing='''    signingConfigs {\n        release {\n            storeFile file("../animevault-release.keystore")\n            storePassword System.getenv("STORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s=s.replace('    buildTypes {', signing+'    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s=s.replace('    buildTypes {\n        release {', '    buildTypes {\n        release {\n            signingConfig signingConfigs.release', 1)
          s=re.sub(r'(versionCode\s+)\d+', rf'\g<1>{code}', s, count=1)
          s=re.sub(r'(versionName\s+)"[^"]+"', rf'\g<1>"{v}"', s, count=1)
          p.write_text(s)
          PY

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build AAB
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/release/*.apk release/android/AnimeVault-Android.apk
          cp android/app/build/outputs/bundle/release/*.aab release/android/AnimeVault-Android.aab
          test -s release/android/AnimeVault-Android.apk
          test -s release/android/AnimeVault-Android.aab
          apksigner verify --verbose release/android/AnimeVault-Android.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-Android
          path: release/android/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: AnimeVault Android Build ${{ github.run_number }}
          body: Automated signed APK and AAB build from main.
          files: |
            release/android/AnimeVault-Android.apk
            release/android/AnimeVault-Android.aab

      - name: Remove keystore
        if: always()
        run: rm -f android/animevault-release.keystore
