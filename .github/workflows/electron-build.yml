name: AnimeVault Desktop Builds & Releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep desktop/Android builds aligned with the production GitHub Pages build.
  # Secrets are supplied by the repository and github-pages environment.
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
  VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
  VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY }}
  VITE_AUTH_PROXY_URL: ${{ secrets.VITE_AUTH_PROXY_URL }}
  VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
  VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

jobs:
  desktop:
    name: Desktop installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install ImageMagick (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        run: choco install imagemagick --yes --no-progress
      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_API_URL VITE_NEON_AUTH_URL VITE_DATABASE_URL VITE_HCAPTCHA_SITEKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing AnimeVault production secret::$name is empty or unavailable to this job"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Build desktop installer
        shell: bash
        env:
          CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run electron:build -- ${{ matrix.args }}
      - name: Verify desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checked-release
          found=0
          for pattern in '*.exe' '*.dmg' '*.zip' '*.AppImage' '*.deb' '*.yml' '*.blockmap'; do
            for file in release/$pattern; do
              if [ -f "$file" ]; then cp "$file" checked-release/; found=1; fi
            done
          done
          if [ "$found" -ne 1 ]; then
            echo 'ERROR: No desktop release files were produced.'
            find release -maxdepth 2 -type f -print || true
            exit 1
          fi
          find checked-release -maxdepth 1 -type f -print | sort
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: animevault-${{ matrix.name }}-installer
          path: checked-release/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_API_URL VITE_NEON_AUTH_URL VITE_DATABASE_URL VITE_HCAPTCHA_SITEKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing AnimeVault production secret::$name is empty or unavailable to this job"
              missing=1
            fi
          done
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing Android signing secret::$name is empty or unavailable to this job"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build web app
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Create Capacitor Android project
        run: npx cap add android
      - name: Generate Android launcher icon resources
        run: |
          set -euo pipefail
          mkdir -p resources
          cp bbe8df3b-a24d-4ec9-bf1b-21076a554fd7.png resources/icon.png
          npx --yes @capacitor/assets generate --android --assetPath resources
      - name: Configure Android release signing and version
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/animevault-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          marker = 'android {\n'
          if marker not in text:
              raise SystemExit('android/app/build.gradle does not contain an android block')
          signing = '''android {\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n'''
          text = text.replace(marker, signing, 1)
          text = text.replace('versionCode 1', 'versionCode ' + '${{ github.run_number }}', 1)
          text = text.replace('release {\n            minifyEnabled', 'release {\n            signingConfig signingConfigs.release\n            minifyEnabled', 1)
          p.write_text(text)
          PY
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/animevault-release.keystore
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/animevault-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "package: name='com.animevault.app'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -q "application-label:'AnimeVault'"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: animevault-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish desktop release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: animevault-Windows-installer
          path: release/Windows
      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: animevault-macOS-installer
          path: release/macOS
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: animevault-Linux-installer
          path: release/Linux
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: animevault-Android-APK
          path: release/Android
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: AnimeVault Desktop Build ${{ github.run_number }}
          body: Automated desktop installers and signed Android APK built from main.
          files: |
            release/Windows/*
            release/macOS/*
            release/Linux/*
            release/Android/*
          fail_on_unmatched_files: true
