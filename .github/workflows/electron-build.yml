name: Automated Installer Builds & Releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write
  actions: read

concurrency:
  group: installer-build-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_ANFIRE_API_URL: ${{ secrets.VITE_ANFIRE_API_URL || 'http://localhost:3000/api.php' }}
  VITE_ANFIRE_API_KEY: ${{ secrets.VITE_ANFIRE_API_KEY || 'default-key' }}
  VITE_ANFIRE_EPISODE_API_URL: ${{ secrets.VITE_ANFIRE_EPISODE_API_URL || 'http://localhost:3000/api.php' }}
  VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
  VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
  VITE_AUTH_PROXY_URL: ${{ secrets.VITE_AUTH_PROXY_URL || 'https://animevaultofficial-github-io.onrender.com' }}
  VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY }}
  VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
  VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

jobs:
  version-bump:
    name: Auto-bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auto-increment patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          IFS='.' read -r major minor patch <<< "$current_version"
          new_version="${major}.${minor}.$((patch + 1))"
          node -e "const fs=require('fs');const pkg=require('./package.json');pkg.version='${new_version}';fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\\n');"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
      - name: Commit and push version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin main

  desktop:
    name: Desktop installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [version-bump]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install ImageMagick (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        run: choco install imagemagick --yes --no-progress
      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
          WIN_CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          WIN_CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
        run: npm run electron:build -- ${{ matrix.args }}
      - name: Verify desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -print | sort
          find release -maxdepth 1 -type f | grep -q . || { echo 'ERROR: No desktop release files were produced.'; exit 1; }
      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: animevault-${{ matrix.name }}-installer
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: [version-bump]
    if: always()
    env:
      ANDROID_PLATFORM: android-34
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_KEYSTORE_PATH: android/animevault-release.keystore
      ANDROID_PACKAGE_NAME: com.animevault.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt" version
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" version
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Generate fresh Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npm run generate-android-icons
          npx vite build --config vite.mobile.config.js
          npx cap sync android
      - name: Decode Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo 'ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured.'
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          chmod 600 "${ANDROID_KEYSTORE_PATH}"
      - name: Configure Android release signing and version
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,re
          from pathlib import Path
          package=json.loads(Path('package.json').read_text())
          version_name=package['version']
          major,minor,patch=(int(part) for part in version_name.split('.')[:3])
          version_code=major*1000000+minor*1000+patch
          path=Path('android/app/build.gradle')
          text=path.read_text()
          signing='''    signingConfigs {\n        release {\n            storeFile file("../animevault-release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in text:
              text=text.replace('    buildTypes {',signing+'    buildTypes {',1)
          if 'signingConfig signingConfigs.release' not in text:
              text=text.replace('    buildTypes {\n        release {','    buildTypes {\n        release {\n            signingConfig signingConfigs.release',1)
          if re.search(r'\n\s*versionCode\s+\d+',text):
              text=re.sub(r'(\n\s*versionCode\s+)\d+',rf'\g<1>{version_code}',text,count=1)
          if re.search(r'\n\s*versionName\s+"[^"]+"',text):
              text=re.sub(r'(\n\s*versionName\s+)"[^"]+"',rf'\g<1>"{version_name}"',text,count=1)
          path.write_text(text)
          PY
      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          package_matches="$(find android/app -type f \( -name '*.gradle' -o -name '*.xml' -o -name '*.java' -o -name '*.kt' \) -print0 | xargs -0 grep -l "${ANDROID_PACKAGE_NAME}" | wc -l)"
          [ "${package_matches}" -gt 0 ] || { echo "ERROR: Generated Android project does not reference ${ANDROID_PACKAGE_NAME}."; exit 1; }
          grep -q 'signingConfigs' android/app/build.gradle
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
      - name: Build signed Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"
          cd android
          ./gradlew clean assembleRelease --stacktrace
      - name: Build signed Android App Bundle
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease --stacktrace
      - name: Locate and normalize Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -f "${apk}"
          test -f "${aab}"
          min_size=$((1024 * 1024))
          [ "$(stat -c%s "${apk}")" -gt "${min_size}" ]
          [ "$(stat -c%s "${aab}")" -gt "${min_size}" ]
          mkdir -p release
          cp "${apk}" release/AnimeVault-Android.apk
          cp "${aab}" release/AnimeVault-Android.aab
      - name: Verify Android APK
        shell: bash
        run: |
          set -euo pipefail
          apk=release/AnimeVault-Android.apk
          unzip -t "${apk}" >/dev/null
          unzip -l "${apk}" | grep -q 'AndroidManifest.xml' || { echo 'ERROR: AndroidManifest.xml missing from APK.'; exit 1; }
          unzip -l "${apk}" | grep -Eq '(^|[[:space:]])classes[0-9]*\.dex$' || { echo 'ERROR: classes.dex missing from APK.'; exit 1; }
          aapt dump badging "${apk}" | grep -q "package: name='${ANDROID_PACKAGE_NAME}'" || { echo "ERROR: APK package name is not ${ANDROID_PACKAGE_NAME}."; exit 1; }
      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs release/AnimeVault-Android.apk
      - name: Verify Android AAB
        shell: bash
        run: |
          set -euo pipefail
          aab=release/AnimeVault-Android.aab
          unzip -t "${aab}" >/dev/null
          unzip -l "${aab}" | grep -q 'BundleConfig.pb' || { echo 'ERROR: BundleConfig.pb missing from AAB.'; exit 1; }
          unzip -l "${aab}" | grep -q 'base/manifest/AndroidManifest.xml' || { echo 'ERROR: Base module AndroidManifest.xml missing from AAB.'; exit 1; }
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-Android
          retention-days: 30
          if-no-files-found: error
          path: |
            release/AnimeVault-Android.apk
            release/AnimeVault-Android.aab
      - name: Delete Android release keystore
        if: always()
        shell: bash
        run: rm -f "${ANDROID_KEYSTORE_PATH}"

  webos:
    name: LG webOS build
    runs-on: ubuntu-latest
    needs: [version-bump]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install LG webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Verify LG webOS CLI
        run: |
          set -euo pipefail
          ares --version
          ares-package --version
      - name: Build LG webOS application
        run: npm run webos:package
      - name: Verify webOS package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-webos/index.html
          test -f dist-webos/appinfo.json
          test -f dist-webos/logo.png
          find dist-ipk -maxdepth 1 -type f -name '*.ipk' -print
          find dist-ipk -maxdepth 1 -type f -name '*.ipk' -print -quit | grep -q . || { echo 'ERROR: No IPK was produced.'; exit 1; }
      - name: Prepare webOS release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ipk="$(find dist-ipk -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          [ -n "${ipk}" ] || { echo 'ERROR: IPK not found.'; exit 1; }
          cp "${ipk}" release/AnimeVault-webOS.ipk
          cd dist-webos
          zip -r ../release/AnimeVault-webOS-source.zip .
      - name: Upload webOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-webos
          retention-days: 30
          if-no-files-found: error
          path: |
            release/AnimeVault-webOS.ipk
            release/AnimeVault-webOS-source.zip

  publish:
    name: Publish GitHub Release
    needs: [desktop, android, webos]
    if: github.event_name != 'pull_request' && needs.desktop.result == 'success' && needs.android.result == 'success' && needs.webos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Download Windows/macOS/Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: animevault-*-installer
          path: release
          merge-multiple: true
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: AnimeVault-Android
          path: release
      - name: Download webOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: AnimeVault-webos
          path: release
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f release/AnimeVault-Android.apk || { echo 'ERROR: AnimeVault-Android.apk is missing.'; exit 1; }
          test -f release/AnimeVault-Android.aab || { echo 'ERROR: AnimeVault-Android.aab is missing.'; exit 1; }
          test -f release/AnimeVault-webOS.ipk || { echo 'ERROR: AnimeVault-webOS.ipk is missing.'; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            cat > release-notes.md <<EOF
          # AnimeVault ${RELEASE_TAG}
          Automated AnimeVault release.
          Version: ${RELEASE_VERSION}
          Built from commit: ${GITHUB_SHA}
          EOF
            gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" --title "AnimeVault ${RELEASE_TAG}" --notes-file release-notes.md --latest
          fi
      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.blockmap' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipk' \) -print)
          [ "${#files[@]}" -gt 0 ] || { echo 'ERROR: No release assets found.'; exit 1; }
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
