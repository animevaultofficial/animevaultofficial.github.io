name: AnimeVault Desktop Builds & Releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    environment: github-pages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win
          - os: macos-latest
            name: macOS
            args: --mac
          - os: ubuntu-latest
            name: Linux
            args: --linux
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_NEON_AUTH_URL: ${{ secrets.VITE_NEON_AUTH_URL }}
      VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
      VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY }}
      VITE_AUTH_PROXY_URL: ${{ secrets.VITE_AUTH_PROXY_URL }}
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install ImageMagick (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        run: choco install imagemagick --yes --no-progress
      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VITE_API_URL VITE_NEON_AUTH_URL VITE_DATABASE_URL VITE_HCAPTCHA_SITEKEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing AnimeVault production secret::$name is empty or unavailable to this job"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Build desktop installer
        shell: bash
        env:
          CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ github.workspace }}/animevault-code-signing.pfx
          WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run electron:build -- ${{ matrix.args }}
      - name: Verify desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checked-release
          found=0
          for pattern in '*.exe' '*.dmg' '*.zip' '*.AppImage' '*.deb' '*.yml' '*.blockmap'; do
            for file in release/$pattern; do
              if [ -f "$file" ]; then cp "$file" checked-release/; found=1; fi
            done
          done
          if [ "$found" -ne 1 ]; then
            echo 'ERROR: No desktop release files were produced.'
            find release -maxdepth 2 -type f -print || true
            exit 1
          fi
          find checked-release -maxdepth 1 -type f -print | sort
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: animevault-${{ matrix.name }}-installer
          path: checked-release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish AnimeVault desktop release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: animevault-Windows-installer
          path: release/Windows
      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: animevault-macOS-installer
          path: release/macOS
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: animevault-Linux-installer
          path: release/Linux
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: animevault-build-${{ github.sha }}
          name: AnimeVault Build ${{ github.sha }}
          body: Automated Windows, macOS, Linux, and signed Android builds from the same commit.
          files: |
            release/Windows/*
            release/macOS/*
            release/Linux/*
          fail_on_unmatched_files: true
