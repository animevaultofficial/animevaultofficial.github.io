name: Apply auth fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Phase 20 auth hardening
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, subprocess
          p=Path('package.json')
          pkg=json.loads(p.read_text())
          pkg.setdefault('dependencies',{})['@capacitor/app']='^6.2.1'
          p.write_text(json.dumps(pkg,indent=2)+'\n')
          subprocess.run(['npm','install','--package-lock-only','--ignore-scripts','--no-audit','--no-fund'],check=True)
          p=Path('src/api/UserContext.jsx')
          s=p.read_text()
          if not s.startswith("import { App }"):
              s="import { App } from '@capacitor/app';"+s
          old=" const loginWithGoogleDb=async()=>{const email=window.prompt('Enter your Google email to sign in on mobile:');if(!email?.trim())return{success:false,message:'Google sign-in cancelled.'};const syncRes=await syncGoogleUserToDb(email.trim(),null,true);if(!syncRes.success)return{success:false,message:syncRes.message||'Google DB login failed.'};const dbUser=syncRes.user;await tryCreateUserSession(dbUser.id);setUser(dbUser);setShowAuthModal(false);return{success:true}};"
          new=" const loginWithGoogleDb=async()=>{try{const native=typeof window!=='undefined'&&!!window.Capacitor;const callbackURL=native?'animevault://oauth/callback':'https://animevaultofficial.fun/';const result=await authClient.signIn.social({provider:'google',callbackURL});if(result?.error)return{success:false,message:result.error.message||'Google sign-in failed.'};return{success:true,pending:true}}catch(err){warn('[AnimeVault Auth] Google sign-in failed:',err?.message||err);return{success:false,message:'Google sign-in could not be started. Please try again.'}}};"
          if old in s: s=s.replace(old,new,1)
          old_effect=" useEffect(()=>{initSession();const subscription=authClient.onAuthStateChange?.((_event,session)=>{if(session?.user)syncAuthSessionUser({session,user:session.user}).finally(()=>setAuthLoading(false));else if(!localStorage.getItem(CACHED_USER_KEY)){setUser(null);setAuthLoading(false)}});return()=>subscription?.data?.subscription?.unsubscribe?.()},[]);"
          new_effect=" useEffect(()=>{initSession();let appUrlListener=null;if(typeof window!=='undefined'&&window.Capacitor){appUrlListener=App.addListener('appUrlOpen',async({url})=>{if(!url?.startsWith('animevault://oauth/callback'))return;try{const parsed=new URL(url);window.location.replace('https://animevaultofficial.fun/'+parsed.search+parsed.hash)}catch(err){warn('[AnimeVault Auth] OAuth callback handling failed:',err?.message||err)}})}const subscription=authClient.onAuthStateChange?.((_event,session)=>{if(session?.user)syncAuthSessionUser({session,user:session.user}).finally(()=>setAuthLoading(false));else if(!localStorage.getItem(CACHED_USER_KEY)){setUser(null);setAuthLoading(false)}});return()=>{subscription?.data?.subscription?.unsubscribe?.();appUrlListener?.then?.(h=>h.remove?.())}},[]);"
          if old_effect in s: s=s.replace(old_effect,new_effect,1)
          p.write_text(s)
          p=Path('.github/workflows/electron-build.yml')
          s=p.read_text()
          marker='          npx cap sync android\n      - name: Decode Android release keystore'
          inject='''          npx cap sync android
          python3 <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          if 'android:scheme="animevault"' not in text:
              marker='<category android:name="android.intent.category.BROWSABLE" />'
              pos=text.find(marker)
              if pos<0: raise SystemExit('Android manifest activity marker not found')
              end=text.find('</intent-filter>',pos)+len('</intent-filter>')
              intent='''          <intent-filter>\n              <action android:name="android.intent.action.VIEW" />\n              <category android:name="android.intent.category.DEFAULT" />\n              <category android:name="android.intent.category.BROWSABLE" />\n              <data android:scheme="animevault" android:host="oauth" />\n          </intent-filter>'''
              text=text[:end]+'\\n'+intent+text[end:]
              path.write_text(text)
          PY
      - name: Decode Android release keystore'''
          if marker in s: s=s.replace(marker,inject,1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-auth-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/api/UserContext.jsx .github/workflows/electron-build.yml .github/workflows/apply-auth-fix.yml
          git commit -m "fix: harden Android Google OAuth callback" || exit 0
          git push
